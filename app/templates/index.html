<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>Итоги торгов — ETS и Каспий</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">Т</span>
        <div>
          <div class="brand-name">TradeResults</div>
          <div class="brand-sub">Итоги торгов ETS и Каспий</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-link active" href="/">Сделки</a>
        <a class="nav-link" href="/status">Статус</a>
      </nav>
    </header>

    <main class="main">
      <section class="intro">
        <h1>Сделки товарных бирж</h1>
        <p>Данные загружаются парсерами в локальную БД. Портал работает только с локальной базой.</p>
      </section>

      <section class="filters" id="filters">
        <div class="filters-grid">
          <label>Биржа
            <select id="f-exchange">
              <option value="all">Обе</option>
              <option value="ETS">ETS</option>
              <option value="CASPIAN">Каспий</option>
            </select>
          </label>
          <label>Дата с
            <input type="date" id="f-date-from" />
          </label>
          <label>Дата по
            <input type="date" id="f-date-to" />
          </label>
          <label>Товар / ключевое слово
            <input type="text" id="f-product" placeholder="бензин, уголь, код…" />
          </label>
          <label>Продавец или покупатель
            <input type="text" id="f-participant" placeholder="имя или БИН" />
          </label>
          <label>Брокер
            <input type="text" id="f-broker" placeholder="название брокера" />
          </label>
          <label>Сумма от, ₸
            <input type="number" id="f-amount-min" min="0" step="1" />
          </label>
          <label>Сумма до, ₸
            <input type="number" id="f-amount-max" min="0" step="1" />
          </label>
          <label>Место / базис поставки
            <input type="text" id="f-delivery" placeholder="FCA, EXW, станция…" />
          </label>
        </div>
        <div class="filters-actions">
          <button type="button" class="btn btn-primary" id="btn-apply">Применить</button>
          <button type="button" class="btn btn-ghost" id="btn-reset">Сбросить</button>
          <span class="meta" id="result-meta"></span>
        </div>
      </section>

      <section class="table-wrap">
        <table class="data-table" id="trades-table">
          <thead>
            <tr>
              <th data-sort="trade_date">Дата</th>
              <th data-sort="exchange">Биржа</th>
              <th data-sort="product">Товар</th>
              <th>Код / ТНВЭД</th>
              <th>Продавец</th>
              <th>Покупатель</th>
              <th>Брокеры</th>
              <th data-sort="volume">Объём</th>
              <th data-sort="price">Цена</th>
              <th data-sort="amount">Сумма</th>
              <th>Поставка</th>
            </tr>
          </thead>
          <tbody id="trades-body">
            <tr><td colspan="11" class="empty">Загрузка…</td></tr>
          </tbody>
        </table>
      </section>

      <section class="pager" id="pager">
        <button type="button" class="btn btn-ghost" id="btn-prev">← Назад</button>
        <span id="page-info">—</span>
        <button type="button" class="btn btn-ghost" id="btn-next">Вперёд →</button>
        <label class="per-page">На странице
          <select id="f-per-page">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
          </select>
        </label>
      </section>
    </main>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
